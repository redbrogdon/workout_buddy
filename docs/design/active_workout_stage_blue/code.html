<!DOCTYPE html>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-card {
            background: rgba(27, 32, 40, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 209, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-slate-950/80 backdrop-blur-md border-b border-cyan-900/50 shadow-[0_0_15px_rgba(0,209,255,0.05)] flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full overflow-hidden border border-cyan-400/30">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="Close-up portrait of a determined athlete with sweat on forehead, dramatic blue lighting, technical sports gear" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCHPsocrIIhNES8geW1_h7ir5lS9UJ32DtcK0Q9Y1UI19INeOfXRrSWBqNUHwrZJsvxraKoTHSyq487pz2Xf4aYTVxlykPxr4_DdZTTO5NOOk-D5zoDovwiwoUgBTkHSFBK-WNX23Ts4gJO7Fh-8LOkyPQ9faZeurhPlqYvoidlQW0h9lFem6qIDDZgYme8e-cURzwZEb9sc7-JTzkbTFrn7Vrj21V_3pkYZSWTNO7RgNHwxs3eNfy8I-OKwHCptEVbZyr56R3W8Hc"/>
</div>
<h1 class="text-xl font-bold text-cyan-400 uppercase tracking-widest font-lexend">Workout Buddy</h1>
</div>
<div class="flex items-center gap-4">
<button class="text-slate-400 hover:bg-cyan-900/20 transition-colors p-2 rounded-lg active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="pt-24 pb-12 px-margin max-w-5xl mx-auto">
<!-- Header Section: Active Task Status -->
<div class="mb-lg flex flex-col md:flex-row md:items-end justify-between gap-md">
<div>
<span class="text-primary font-label-sm uppercase tracking-widest mb-xs block">Current Exercise</span>
<h2 class="text-headline-lg font-headline-lg text-on-surface">Standard Pushups</h2>
<p class="text-on-surface-variant font-body-md">Set 3 of 5 • Chest &amp; Triceps</p>
</div>
<div class="glass-card px-md py-sm rounded-xl flex items-center gap-sm">
<span class="material-symbols-outlined text-cyan-400" data-icon="timer">timer</span>
<span class="text-headline-md font-headline-md text-cyan-400 tracking-tight">00:42</span>
</div>
</div>
<!-- Bento Grid Layout -->
<div class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
<!-- Main Rep Counter Card -->
<div class="md:col-span-7 glass-card rounded-full p-lg flex flex-col items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-cyan-500/5 to-transparent pointer-events-none"></div>
<span class="text-on-surface-variant font-label-lg uppercase mb-md">Completed Reps</span>
<div class="flex items-center gap-xl">
<button class="w-16 h-16 rounded-full border border-cyan-400/20 flex items-center justify-center text-cyan-400 hover:bg-cyan-400/10 active:scale-90 transition-all">
<span class="material-symbols-outlined text-3xl" data-icon="remove">remove</span>
</button>
<div class="text-center">
<div class="text-[120px] leading-none font-extrabold text-cyan-400 tracking-tighter">18</div>
<div class="text-on-surface-variant font-label-md mt-xs">TARGET: 25</div>
</div>
<button class="w-16 h-16 rounded-full bg-cyan-400 text-on-primary flex items-center justify-center hover:bg-primary-container active:scale-90 transition-all shadow-[0_0_20px_rgba(0,209,255,0.3)]">
<span class="material-symbols-outlined text-3xl" data-icon="add">add</span>
</button>
</div>
<div class="mt-lg w-full max-w-xs bg-slate-800 h-1 rounded-full overflow-hidden">
<div class="bg-cyan-400 h-full w-[72%] shadow-[0_0_10px_rgba(0,209,255,0.5)]"></div>
</div>
</div>
<!-- Form Guide & Visuals -->
<div class="md:col-span-5 space-y-gutter">
<!-- Form Visual -->
<div class="glass-card rounded-xl overflow-hidden aspect-video relative group">
<img alt="Pushup Form" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-700" data-alt="Professional athlete performing a perfect pushup on a dark gym floor with cyan neon accent lighting highlighting muscle definition" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMcC6OcOeb_U3dlJLX_CdTtHuOBUk_npuYTorMxFJwdVqOk8tLq5-M3Malp3zI5J6JZBLwUS0Np-1ECqfkgg8X8wsf-5q3H2aXjE1gnBpMNyGjTCkvn2x5gT1vRLkZWhZEQ_51OUnDVqUsYmVWg1GEX4CRXmfJSAtlyEcRelk0uC9u6zTOak2DXrcrDWpB0_2_MvIqKMJ8dD2e4AXkr2b6ijP5WYJyQ4rCSP25A0pJ6M8Msje2Xix6TbL1q5Pq3u4R8XiJFHHSuXQ"/>
<div class="absolute inset-0 bg-gradient-to-t from-slate-950 to-transparent"></div>
<div class="absolute bottom-4 left-4 flex items-center gap-base">
<span class="material-symbols-outlined text-cyan-400 text-sm" data-icon="verified">verified</span>
<span class="text-label-md text-white">Form Guide: Keep Back Straight</span>
</div>
</div>
<!-- Heart Rate / Metrics -->
<div class="glass-card rounded-xl p-md">
<div class="flex justify-between items-center mb-md">
<h3 class="text-label-lg text-on-surface-variant uppercase">Biometrics</h3>
<span class="material-symbols-outlined text-error" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<div class="flex items-end gap-xs">
<span class="text-headline-md font-headline-md text-on-surface">142</span>
<span class="text-label-md text-on-surface-variant mb-base">BPM</span>
</div>
<div class="mt-base h-8 flex items-end gap-[2px]">
<div class="bg-cyan-900/40 w-full h-[40%] rounded-t-sm"></div>
<div class="bg-cyan-900/40 w-full h-[60%] rounded-t-sm"></div>
<div class="bg-cyan-400 w-full h-[85%] rounded-t-sm shadow-[0_0_8px_rgba(0,209,255,0.4)]"></div>
<div class="bg-cyan-400 w-full h-[70%] rounded-t-sm shadow-[0_0_8px_rgba(0,209,255,0.4)]"></div>
<div class="bg-cyan-900/40 w-full h-[55%] rounded-t-sm"></div>
<div class="bg-cyan-900/40 w-full h-[45%] rounded-t-sm"></div>
</div>
</div>
</div>
<!-- Set History / Upcoming -->
<div class="md:col-span-12 glass-card rounded-xl p-md">
<div class="flex items-center justify-between mb-md">
<h3 class="text-label-lg text-on-surface font-semibold uppercase tracking-tight">Set Breakdown</h3>
<button class="text-cyan-400 text-label-md flex items-center gap-xs hover:underline">
                        View Routine <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<div class="grid grid-cols-5 gap-sm">
<div class="bg-cyan-400/20 border border-cyan-400/40 rounded-lg p-sm text-center">
<span class="text-label-sm text-cyan-400 block">S1</span>
<span class="text-body-md font-bold text-on-surface">20</span>
</div>
<div class="bg-cyan-400/20 border border-cyan-400/40 rounded-lg p-sm text-center">
<span class="text-label-sm text-cyan-400 block">S2</span>
<span class="text-body-md font-bold text-on-surface">22</span>
</div>
<div class="bg-cyan-500 border border-cyan-400 rounded-lg p-sm text-center shadow-[0_0_15px_rgba(0,209,255,0.2)]">
<span class="text-label-sm text-on-primary block">S3</span>
<span class="text-body-md font-bold text-on-primary">18</span>
</div>
<div class="bg-slate-900/50 border border-slate-800 rounded-lg p-sm text-center opacity-50">
<span class="text-label-sm text-slate-500 block">S4</span>
<span class="text-body-md font-bold text-slate-500">—</span>
</div>
<div class="bg-slate-900/50 border border-slate-800 rounded-lg p-sm text-center opacity-50">
<span class="text-label-sm text-slate-500 block">S5</span>
<span class="text-body-md font-bold text-slate-500">—</span>
</div>
</div>
</div>
</div>
<!-- Action Footer -->
<div class="mt-lg flex gap-md">
<button class="flex-1 h-14 rounded-full bg-gradient-to-r from-secondary-container to-secondary text-on-secondary font-label-lg uppercase tracking-wider shadow-lg active:scale-95 transition-transform">
                Finish Set
            </button>
<button class="w-14 h-14 rounded-full border border-error/30 text-error flex items-center justify-center hover:bg-error/10 transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</main>
<!-- Suppressed BottomNavBar for focus, showing contextual completion hint -->
<div class="fixed bottom-0 w-full h-2 px-4 bg-slate-950/90 z-50">
<div class="w-full h-full bg-cyan-900/30 overflow-hidden">
<div class="bg-cyan-400 h-full w-[45%]"></div>
</div>
</div>
</body></html>
